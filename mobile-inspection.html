<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移动巡检 - 梁邹铁路专用线安全管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.3/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            touch-action: manipulation;
        }
        .hero-title {
            font-family: 'Noto Serif SC', serif;
        }
        .mobile-card {
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
        }
        .mobile-card:active {
            transform: scale(0.98);
        }
        .scan-button {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
        }
        .scan-button:active {
            transform: scale(0.95);
        }
        .status-indicator {
            animation: pulse 2s infinite;
        }
        .floating-scan {
            position: fixed;
            bottom: 100px;
            right: 20px;
            z-index: 50;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .floating-scan:active {
            transform: scale(0.9);
        }
        .inspection-item {
            border-left: 4px solid #e5e7eb;
            transition: all 0.3s ease;
        }
        .inspection-item.completed {
            border-left-color: #10b981;
            background-color: #f0fdf4;
        }
        .inspection-item.required {
            border-left-color: #ef4444;
        }
        .photo-preview {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #e5e7eb;
        }
        .modal {
            backdrop-filter: blur(5px);
        }
        @media (max-width: 640px) {
            .mobile-padding {
                padding-left: 1rem;
                padding-right: 1rem;
            }
        }
    </style>
</head>
<body class="min-h-screen pb-20">
    <!-- 顶部导航栏 -->
    <nav class="bg-white shadow-lg fixed w-full top-0 z-40">
        <div class="max-w-md mx-auto px-4 mobile-padding">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <h1 class="text-lg font-bold text-gray-800">移动巡检</h1>
                </div>
                <div class="flex items-center space-x-2">
                    <div class="w-6 h-6 bg-gradient-to-br from-green-500 to-green-700 rounded-full flex items-center justify-center">
                        <span class="text-white text-xs font-bold" id="user-avatar-mobile">用</span>
                    </div>
                    <button onclick="logout()" class="p-2 text-gray-600 hover:text-gray-800 transition-colors" title="退出登录">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <div class="pt-16">
        <!-- 快捷操作区域 -->
        <div class="max-w-md mx-auto px-4 mobile-padding py-6">
            <!-- 扫码按钮 -->
            <div class="mb-6">
                <button onclick="startScan()" class="scan-button w-full text-white py-4 px-6 rounded-2xl text-lg font-semibold flex items-center justify-center">
                    <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
                    </svg>
                    开始扫码巡检
                </button>
            </div>

            <!-- 快速统计 -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="mobile-card bg-white p-4">
                    <div class="text-center">
                        <div class="text-2xl font-bold text-green-600" id="today-count">8</div>
                        <div class="text-sm text-gray-600">今日已巡检</div>
                    </div>
                </div>
                <div class="mobile-card bg-white p-4">
                    <div class="text-center">
                        <div class="text-2xl font-bold text-orange-600" id="pending-count">3</div>
                        <div class="text-sm text-gray-600">待巡检</div>
                    </div>
                </div>
            </div>

            <!-- 最近巡检记录 -->
            <div class="mobile-card bg-white p-4 mb-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-gray-800">最近巡检</h3>
                    <button onclick="showAllRecords()" class="text-green-600 text-sm">查看全部</button>
                </div>
                <div id="recent-records" class="space-y-3">
                    <!-- 最近巡检记录 -->
                </div>
            </div>

            <!-- 巡检路线 -->
            <div class="mobile-card bg-white p-4 mb-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">今日巡检路线</h3>
                <div id="today-routes" class="space-y-3">
                    <!-- 今日巡检路线 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 浮动扫码按钮 -->
    <div class="floating-scan" onclick="startScan()">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
        </svg>
    </div>

    <!-- 底部导航 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-40">
        <div class="max-w-md mx-auto px-4 mobile-padding">
            <div class="flex justify-around py-2">
                <button onclick="showHome()" class="flex flex-col items-center py-2 px-3 text-green-600">
                    <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    <span class="text-xs">首页</span>
                </button>
                <button onclick="showScan()" class="flex flex-col items-center py-2 px-3 text-gray-600">
                    <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
                    </svg>
                    <span class="text-xs">扫码</span>
                </button>
                <button onclick="showRecords()" class="flex flex-col items-center py-2 px-3 text-gray-600">
                    <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
                    </svg>
                    <span class="text-xs">记录</span>
                </button>
                <button onclick="showProfile()" class="flex flex-col items-center py-2 px-3 text-gray-600">
                    <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    <span class="text-xs">我的</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 扫码模态框 -->
    <div id="scan-modal" class="modal fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 m-4 max-w-sm w-full">
            <div class="text-center">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">扫码巡检</h3>
                <div class="mb-4">
                    <div class="w-32 h-32 mx-auto bg-gray-100 rounded-lg flex items-center justify-center mb-4">
                        <svg class="w-16 h-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
                        </svg>
                    </div>
                    <p class="text-gray-600 mb-4">请将二维码放入框内</p>
                </div>
                <div class="flex justify-center space-x-2">
                    <button onclick="hideScanModal()" class="bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700 transition-colors text-sm">
                        取消
                    </button>
                    <button onclick="simulateScan()" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition-colors text-sm">
                        模拟扫码
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 巡检表单模态框 -->
    <div id="inspection-modal" class="modal fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-4 m-2 max-w-sm w-full max-h-screen overflow-y-auto">
            <div class="mb-4">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-lg font-semibold text-gray-800" id="inspection-point-name">巡检点名称</h3>
                    <button onclick="hideInspectionModal()" class="text-gray-400 hover:text-gray-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                <div class="text-sm text-gray-600 mb-4" id="inspection-point-location">巡检点位置</div>
                <div class="text-sm text-blue-600 mb-4">
                    <span id="inspection-point-description">巡检点描述</span>
                </div>
            </div>
            
            <form id="inspection-form" class="space-y-4">
                <div id="inspection-items">
                    <!-- 巡检项目将动态生成 -->
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">备注</label>
                    <textarea id="inspection-notes" name="notes" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 text-sm" placeholder="请输入巡检备注..."></textarea>
                </div>
                
                <div class="flex justify-end space-x-2 pt-4">
                    <button type="button" onclick="hideInspectionModal()" class="px-4 py-2 text-gray-600 hover:text-gray-800 transition-colors text-sm">
                        取消
                    </button>
                    <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition-colors text-sm">
                        提交巡检
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="api-service.js"></script>
    <script>
        // 移动巡检页面JavaScript
        let currentUser = null;
        let currentPoint = null;
        let inspectionItems = [];
        let inspectionData = {};
        let currentLocation = null;
        let todayRecords = [];
        let todayRoutes = [];

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', async function() {
            checkUserLogin();
            await loadUserInfo();
            await loadTodayData();
            getCurrentLocation();
            bindEvents();
        });

        // 加载今日数据
        async function loadTodayData() {
            try {
                // 获取今日巡检记录
                const recordsResponse = await apiService.getInspectionRecords({
                    inspector_id: currentUser.id,
                    start_date: new Date().toISOString().split('T')[0],
                    end_date: new Date().toISOString().split('T')[0]
                });
                
                if (recordsResponse.success) {
                    todayRecords = recordsResponse.data;
                    renderRecentRecords();
                    updateStatistics();
                }

                // 模拟今日路线数据
                todayRoutes = [
                    {
                        name: 'A站 → B站',
                        points: 8,
                        completed: todayRecords.filter(r => r.point_id >= 1 && r.point_id <= 8).length,
                        estimated_time: '2小时'
                    },
                    {
                        name: 'C站 → D站',
                        points: 6,
                        completed: todayRecords.filter(r => r.point_id >= 9 && r.point_id <= 14).length,
                        estimated_time: '1.5小时'
                    }
                ];
                
                renderTodayRoutes();
            } catch (error) {
                console.error('加载今日数据失败:', error);
                showMessage('加载数据失败', 'error');
            }
        }

        // 检查用户登录状态
        function checkUserLogin() {
            const userInfo = localStorage.getItem('userInfo') || sessionStorage.getItem('userInfo');
            
            if (!userInfo) {
                window.location.href = 'login.html';
                return;
            }
            
            currentUser = JSON.parse(userInfo);
            
            // 显示用户信息
            document.getElementById('user-avatar-mobile').textContent = currentUser.fullName.charAt(0);
        }

        // 加载用户信息
        async function loadUserInfo() {
            try {
                const response = await apiService.getCurrentUser();
                if (response.success) {
                    currentUser = response.user;
                    console.log('Current user:', currentUser);
                } else {
                    console.error('获取用户信息失败:', response.message);
                }
            } catch (error) {
                console.error('获取用户信息失败:', error);
            }
        }

        // 获取当前位置
        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        currentLocation = {
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude
                        };
                    },
                    function(error) {
                        console.log('无法获取位置信息:', error);
                        currentLocation = { latitude: 0, longitude: 0 };
                    }
                );
            } else {
                currentLocation = { latitude: 0, longitude: 0 };
            }
        }

        // 渲染最近巡检记录
        function renderRecentRecords() {
            const container = document.getElementById('recent-records');
            
            container.innerHTML = todayRecords.slice(0, 3).map(record => {
                // 根据point_id获取巡检点名称
                const pointName = `巡检点 ${record.point_id}`;
                
                return `
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                        <div class="flex-1">
                            <div class="font-medium text-gray-800 text-sm">${pointName}</div>
                            <div class="text-xs text-gray-600">${formatTime(record.inspection_time)} - ${record.inspector_id}</div>
                        </div>
                        <div class="flex-shrink-0">
                            <span class="px-2 py-1 text-xs rounded-full ${getStatusColor(record.status)}">
                                ${getStatusText(record.status)}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 格式化时间显示
        function formatTime(timeString) {
            try {
                const date = new Date(timeString);
                return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            } catch (e) {
                return timeString;
            }
        }

        // 渲染今日巡检路线
        function renderTodayRoutes() {
            const container = document.getElementById('today-routes');
            
            container.innerHTML = todayRoutes.map(route => `
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                    <div class="flex-1">
                        <div class="font-medium text-gray-800 text-sm">${route.name}</div>
                        <div class="text-xs text-gray-600">${route.completed}/${route.points} 巡检点</div>
                    </div>
                    <div class="flex-shrink-0 text-right">
                        <div class="text-sm font-medium text-green-600">${Math.round(route.completed / route.points * 100)}%</div>
                        <div class="text-xs text-gray-600">${route.estimated_time}</div>
                    </div>
                </div>
            `).join('');
        }

        // 更新统计信息
        function updateStatistics() {
            document.getElementById('today-count').textContent = todayRecords.length;
            document.getElementById('pending-count').textContent = todayRoutes.reduce((sum, route) => sum + (route.points - route.completed), 0);
        }

        // 获取状态颜色
        function getStatusColor(status) {
            switch (status) {
                case 'normal': return 'bg-green-100 text-green-800';
                case 'abnormal': return 'bg-red-100 text-red-800';
                case 'pending': return 'bg-yellow-100 text-yellow-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        // 获取状态文本
        function getStatusText(status) {
            switch (status) {
                case 'normal': return '正常';
                case 'abnormal': return '异常';
                case 'pending': return '待巡检';
                default: return '未知';
            }
        }

        // 开始扫码
        function startScan() {
            // 在实际应用中，这里会调用微信的扫码API
            // 这里使用模拟扫码
            showScanModal();
        }

        // 显示扫码模态框
        function showScanModal() {
            const modal = document.getElementById('scan-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            anime({
                targets: '#scan-modal > div',
                scale: [0.8, 1],
                opacity: [0, 1],
                duration: 300,
                easing: 'easeOutQuad'
            });
        }

        // 隐藏扫码模态框
        function hideScanModal() {
            const modal = document.getElementById('scan-modal');
            
            anime({
                targets: '#scan-modal > div',
                scale: [1, 0.8],
                opacity: [1, 0],
                duration: 200,
                easing: 'easeInQuad',
                complete: () => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }
            });
        }

        // 模拟扫码
        async function simulateScan() {
            hideScanModal();
            
            try {
                // 模拟扫码结果
                const mockQRResult = {
                    type: 'inspection_point',
                    point_id: '1',
                    point_name: 'A站信号设备',
                    location: 'A站控制室',
                    description: 'A站主要信号设备状态检查'
                };
                
                // 验证二维码
                const response = await apiService.verifyQRCode({qr_token: btoa(JSON.stringify(mockQRResult))});
                
                if (response.success) {
                    // 显示巡检表单
                    showInspectionModal(response.data);
                } else {
                    showMessage('二维码验证失败: ' + response.message, 'error');
                }
            } catch (error) {
                console.error('扫码验证失败:', error);
                showMessage('扫码验证失败', 'error');
            }
        }

        // 显示巡检表单模态框
        async function showInspectionModal(pointInfo) {
            currentPoint = pointInfo;
            
            document.getElementById('inspection-point-name').textContent = pointInfo.name;
            document.getElementById('inspection-point-location').textContent = pointInfo.location;
            document.getElementById('inspection-point-description').textContent = pointInfo.description;
            
            try {
                // 获取巡检项目
                const response = await apiService.getInspectionItems(pointInfo.id);
                if (response.success) {
                    inspectionItems = response.data;
                    generateInspectionItems();
                } else {
                    showMessage('获取巡检项目失败: ' + response.message, 'error');
                    return;
                }
            } catch (error) {
                console.error('获取巡检项目失败:', error);
                showMessage('获取巡检项目失败', 'error');
                return;
            }
            
            const modal = document.getElementById('inspection-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            anime({
                targets: '#inspection-modal > div',
                scale: [0.8, 1],
                opacity: [0, 1],
                duration: 300,
                easing: 'easeOutQuad'
            });
        }

        // 隐藏巡检表单模态框
        function hideInspectionModal() {
            const modal = document.getElementById('inspection-modal');
            
            anime({
                targets: '#inspection-modal > div',
                scale: [1, 0.8],
                opacity: [1, 0],
                duration: 200,
                easing: 'easeInQuad',
                complete: () => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }
            });
        }

        // 生成巡检项目
        function generateInspectionItems() {
            const container = document.getElementById('inspection-items');
            container.innerHTML = '';
            
            inspectionItems.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = `inspection-item p-3 rounded-lg ${item.required ? 'required' : ''}`;
                
                let inputHTML = '';
                
                switch (item.item_type) {
                    case 'checkbox':
                        inputHTML = `
                            <label class="flex items-center">
                                <input type="checkbox" name="item_${item.id}" class="mr-2" ${item.required ? 'required' : ''}>
                                <span class="text-sm ${item.required ? 'font-medium text-red-700' : 'text-gray-700'}">${item.item_name}${item.required ? '*' : ''}</span>
                            </label>
                        `;
                        break;
                    case 'radio':
                        inputHTML = `
                            <div class="text-sm ${item.required ? 'font-medium text-red-700' : 'text-gray-700'} mb-2">${item.item_name}${item.required ? '*' : ''}</div>
                            <div class="space-y-1">
                                <label class="flex items-center">
                                    <input type="radio" name="item_${item.id}" value="良好" class="mr-2" ${item.required ? 'required' : ''}>
                                    <span class="text-sm text-gray-700">良好</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="radio" name="item_${item.id}" value="一般" class="mr-2" ${item.required ? 'required' : ''}>
                                    <span class="text-sm text-gray-700">一般</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="radio" name="item_${item.id}" value="较差" class="mr-2" ${item.required ? 'required' : ''}>
                                    <span class="text-sm text-gray-700">较差</span>
                                </label>
                            </div>
                        `;
                        break;
                    case 'text':
                        inputHTML = `
                            <label class="block text-sm ${item.required ? 'font-medium text-red-700' : 'text-gray-700'} mb-2">${item.item_name}${item.required ? '*' : ''}</label>
                            <textarea name="item_${item.id}" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 text-sm" ${item.required ? 'required' : ''}></textarea>
                        `;
                        break;
                }
                
                itemDiv.innerHTML = inputHTML;
                container.appendChild(itemDiv);
            });
        }

        // 提交巡检表单
        async function submitInspection() {
            if (!currentPoint) return;
            
            const formData = new FormData(document.getElementById('inspection-form'));
            const data = Object.fromEntries(formData.entries());
            
            // 验证必填项
            const requiredItems = inspectionItems.filter(item => item.required);
            for (let item of requiredItems) {
                const fieldName = `item_${item.id}`;
                if (!data[fieldName] || data[fieldName] === '') {
                    showMessage(`请完成必填项: ${item.item_name}`, 'error');
                    return;
                }
            }
            
            // 构建巡检数据
            const inspectionRecord = {
                point_id: currentPoint.id,
                inspector_id: currentUser.id,
                inspection_time: new Date().toISOString(),
                status: data.abnormal ? 'abnormal' : 'normal',
                items_checked: inspectionItems.map(item => item.id), // 所有项目都被检查
                abnormal_items: [], // 根据实际检查结果填充
                photos: [],
                notes: data.notes || '',
                gps_location: currentLocation ? `${currentLocation.latitude},${currentLocation.longitude}` : '0,0',
                weather_condition: '晴朗' // 可以从API获取
            };

            try {
                // 提交巡检记录
                const response = await apiService.createInspectionRecord(inspectionRecord);
                
                if (response.success) {
                    // 添加到本地记录
                    todayRecords.unshift(response.data);
                    renderRecentRecords();
                    updateStatistics();
                    
                    hideInspectionModal();
                    showMessage('巡检记录提交成功', 'success');
                    
                    // 重置表单
                    document.getElementById('inspection-form').reset();
                    currentPoint = null;
                    inspectionData = {};
                } else {
                    showMessage('提交巡检记录失败: ' + response.message, 'error');
                }
            } catch (error) {
                console.error('提交巡检记录失败:', error);
                showMessage('提交巡检记录失败', 'error');
            }
        }

        // 页面切换功能
        function showHome() {
            // 已经在首页
        }

        function showScan() {
            startScan();
        }

        function showRecords() {
            alert('巡检记录页面开发中...');
        }

        function showProfile() {
            alert('个人中心页面开发中...');
        }

        // 绑定事件
        function bindEvents() {
            // 巡检表单提交
            document.getElementById('inspection-form').addEventListener('submit', function(e) {
                e.preventDefault();
                submitInspection();
            });
        }

        // 显示消息
        function showMessage(message, type) {
            // 移动端消息提示
            const messageDiv = document.createElement('div');
            messageDiv.className = `fixed top-20 left-4 right-4 p-3 rounded-lg shadow-lg z-50 text-center text-sm ${
                type === 'success' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'
            }`;
            messageDiv.textContent = message;
            
            document.body.appendChild(messageDiv);
            
            anime({
                targets: messageDiv,
                translateY: [-50, 0],
                opacity: [0, 1],
                duration: 300,
                easing: 'easeOutQuad'
            });
            
            setTimeout(() => {
                anime({
                    targets: messageDiv,
                    translateY: [0, -50],
                    opacity: [1, 0],
                    duration: 300,
                    easing: 'easeInQuad',
                    complete: () => {
                        document.body.removeChild(messageDiv);
                    }
                });
            }, 3000);
        }

        // 退出登录
        function logout() {
            localStorage.removeItem('userInfo');
            localStorage.removeItem('token');
            sessionStorage.removeItem('userInfo');
            sessionStorage.removeItem('token');
            window.location.href = 'login.html';
        }

        // 页面加载动画
        window.addEventListener('load', function() {
            anime({
                targets: '.mobile-card',
                translateY: [50, 0],
                opacity: [0, 1],
                delay: anime.stagger(100),
                duration: 800,
                easing: 'easeOutQuad'
            });
            
            anime({
                targets: '.floating-scan',
                scale: [0, 1],
                opacity: [0, 1],
                duration: 600,
                delay: 500,
                easing: 'easeOutElastic(1, .8)'
            });
        });
    </script>
</body>
</html>
