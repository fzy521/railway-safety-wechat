<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 梁邹铁路专用线安全管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
        }
        .hero-title {
            font-family: 'Noto Serif SC', serif;
        }
        .login-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
        .form-input {
            transition: all 0.3s ease;
        }
        .form-input:focus {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .password-toggle {
            cursor: pointer;
        }
        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        .shape {
            position: absolute;
            opacity: 0.1;
        }
        .shape-1 {
            width: 200px;
            height: 200px;
            background: linear-gradient(45deg, #3b82f6, #1e3a8a);
            border-radius: 50%;
            top: 10%;
            left: 10%;
            animation: float 6s ease-in-out infinite;
        }
        .shape-2 {
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, #1e3a8a, #3b82f6);
            border-radius: 30%;
            top: 60%;
            right: 15%;
            animation: float 8s ease-in-out infinite reverse;
        }
        .shape-3 {
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #3b82f6, #60a5fa);
            border-radius: 50%;
            bottom: 20%;
            left: 20%;
            animation: float 7s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative">
    <!-- 浮动背景形状 -->
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- 主容器 -->
    <div class="login-card rounded-2xl shadow-2xl p-8 m-4 w-full max-w-md">
        <!-- Logo和标题 -->
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-br from-blue-500 to-blue-700 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
            </div>
            <h1 class="hero-title text-3xl font-bold text-gray-800 mb-2">梁邹铁路专用线</h1>
            <p class="text-gray-600">安全管理系统</p>
        </div>

        <!-- 登录表单 -->
        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">用户名</label>
                <div class="relative">
                    <input type="text" id="username" name="username" required
                           class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="请输入用户名">
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                        <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                <div class="relative">
                    <input type="password" id="password" name="password" required
                           class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="请输入密码">
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center password-toggle" onclick="togglePassword()">
                        <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="eye-icon">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input type="checkbox" id="remember" name="remember" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                    <label for="remember" class="ml-2 block text-sm text-gray-700">记住我</label>
                </div>
                <div class="text-sm">
                    <a href="#" class="font-medium text-blue-600 hover:text-blue-500" onclick="showForgotPassword()">忘记密码？</a>
                </div>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white py-3 px-4 rounded-lg hover:from-blue-700 hover:to-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all duration-200 transform hover:scale-105">
                <span class="flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                    </svg>
                    登录系统
                </span>
            </button>
        </form>

        <!-- 底部信息 -->
        <div class="mt-8 text-center">
            <p class="text-sm text-gray-600">© 2025 梁邹铁路专用线安全管理系统</p>
            <p class="text-xs text-gray-500 mt-1">版本 2.0 - 带后台管理功能</p>
        </div>
    </div>

    <!-- 忘记密码模态框 -->
    <div id="forgot-password-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 m-4 max-w-md w-full">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">忘记密码</h3>
            <form id="forgot-password-form">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">注册邮箱</label>
                    <input type="email" id="reset-email" name="email" required
                           class="form-input w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="请输入注册邮箱">
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" onclick="hideForgotPassword()" class="px-4 py-2 text-gray-600 hover:text-gray-800 transition-colors">
                        取消
                    </button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
                        发送重置链接
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="api-client.js"></script>
    <script>
        // 登录功能
        document.addEventListener('DOMContentLoaded', function() {
            // 页面加载动画
            anime({
                targets: '.login-card',
                scale: [0.8, 1],
                opacity: [0, 1],
                duration: 800,
                easing: 'easeOutElastic(1, .8)'
            });

            // 表单提交
            document.getElementById('login-form').addEventListener('submit', function(e) {
                e.preventDefault();
                handleLogin();
            });

            // 忘记密码表单
            document.getElementById('forgot-password-form').addEventListener('submit', function(e) {
                e.preventDefault();
                handleForgotPassword();
            });
        });

        // 处理登录
        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const remember = document.getElementById('remember').checked;

            // 验证输入
            if (!username) {
                showMessage('请输入用户名', 'error');
                return;
            }

            if (!password) {
                showMessage('请输入密码', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('密码长度至少为6位', 'error');
                return;
            }

            try {
                // 使用真实API调用
                const response = await apiClient.login(username, password);
                
                if (response.success) {
                    showMessage('登录成功，正在跳转...', 'success');
                    
                    // 跳转到主页
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    showMessage(response.message || '登录失败', 'error');
                }
            } catch (error) {
                showMessage('登录过程中发生错误', 'error');
                console.error('Login error:', error);
            }
        }

        // 模拟登录API
        function simulateLogin(username, password) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    // 模拟用户数据
                    const users = [
                        {
                            id: 1,
                            username: 'admin',
                            password: 'admin123',
                            fullName: '超级管理员',
                            role: '超级管理员',
                            permissions: ['system.manage', 'user.manage', 'safety.view', 'risk.manage', 'incident.manage', 'training.manage', 'certificate.manage']
                        },
                        {
                            id: 2,
                            username: 'safety_manager',
                            password: 'safety123',
                            fullName: '安全管理员',
                            role: '安全管理员',
                            permissions: ['safety.view', 'risk.manage', 'incident.manage']
                        },
                        {
                            id: 3,
                            username: 'train_manager',
                            password: 'train123',
                            fullName: '培训管理员',
                            role: '培训管理员',
                            permissions: ['training.manage', 'certificate.manage']
                        }
                    ];

                    const user = users.find(u => u.username === username && u.password === password);

                    if (user) {
                        resolve({
                            success: true,
                            token: 'simulated_jwt_token_' + Date.now(),
                            user: user
                        });
                    } else {
                        resolve({
                            success: false,
                            message: '用户名或密码错误'
                        });
                    }
                }, 1000);
            });
        }

        // 切换密码显示
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M22.485 22.485L2.515 2.515"></path>
                `;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                `;
            }
        }

        // 显示忘记密码模态框
        function showForgotPassword() {
            document.getElementById('forgot-password-modal').classList.remove('hidden');
            document.getElementById('forgot-password-modal').classList.add('flex');
            
            anime({
                targets: '#forgot-password-modal > div',
                scale: [0.8, 1],
                opacity: [0, 1],
                duration: 300,
                easing: 'easeOutQuad'
            });
        }

        // 隐藏忘记密码模态框
        function hideForgotPassword() {
            anime({
                targets: '#forgot-password-modal > div',
                scale: [1, 0.8],
                opacity: [1, 0],
                duration: 200,
                easing: 'easeInQuad',
                complete: () => {
                    document.getElementById('forgot-password-modal').classList.add('hidden');
                    document.getElementById('forgot-password-modal').classList.remove('flex');
                }
            });
        }

        // 处理忘记密码
        async function handleForgotPassword() {
            const email = document.getElementById('reset-email').value;
            
            if (!email) {
                showMessage('请输入邮箱地址', 'error');
                return;
            }

            try {
                // 模拟API调用
                const response = await simulatePasswordReset(email);
                
                if (response.success) {
                    showMessage('重置链接已发送到您的邮箱', 'success');
                    hideForgotPassword();
                    document.getElementById('forgot-password-form').reset();
                } else {
                    showMessage(response.message || '发送失败', 'error');
                }
            } catch (error) {
                showMessage('发送过程中发生错误', 'error');
                console.error('Password reset error:', error);
            }
        }

        // 模拟密码重置API
        function simulatePasswordReset(email) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    // 模拟邮箱验证
                    const validEmails = ['admin@example.com', 'safety@example.com', 'train@example.com'];
                    
                    if (validEmails.includes(email)) {
                        resolve({ success: true });
                    } else {
                        resolve({ success: false, message: '该邮箱未注册' });
                    }
                }, 1000);
            });
        }

        // 显示消息
        function showMessage(message, type) {
            // 创建消息元素
            const messageDiv = document.createElement('div');
            messageDiv.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg z-50 ${
                type === 'success' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'
            }`;
            messageDiv.textContent = message;
            
            document.body.appendChild(messageDiv);
            
            // 动画显示
            anime({
                targets: messageDiv,
                translateX: [300, 0],
                opacity: [0, 1],
                duration: 300,
                easing: 'easeOutQuad'
            });
            
            // 3秒后自动消失
            setTimeout(() => {
                anime({
                    targets: messageDiv,
                    translateX: [0, 300],
                    opacity: [1, 0],
                    duration: 300,
                    easing: 'easeInQuad',
                    complete: () => {
                        document.body.removeChild(messageDiv);
                    }
                });
            }, 3000);
        }

        // 检查是否已登录
        function checkLoginStatus() {
            const userInfo = localStorage.getItem('userInfo') || sessionStorage.getItem('userInfo');
            if (userInfo) {
                // 已登录，跳转到主页
                window.location.href = 'index.html';
            }
        }

        // 页面加载时检查登录状态
        checkLoginStatus();
    </script>
</body>
</html>
