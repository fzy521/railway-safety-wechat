<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全培训管理 - 梁邹铁路专用线</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
        }
        .hero-title {
            font-family: 'Noto Serif SC', serif;
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .form-input {
            transition: all 0.3s ease;
        }
        .form-input:focus {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .calendar-day {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .calendar-day:hover {
            background-color: #dbeafe;
            transform: scale(1.1);
        }
        .calendar-day.has-training {
            background-color: #3b82f6;
            color: white;
        }
        .calendar-day.has-training:hover {
            background-color: #1d4ed8;
        }
        .progress-bar {
            transition: width 0.5s ease;
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-lg fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <h1 class="text-xl font-bold text-gray-800">梁邹铁路专用线</h1>
                    </div>
                </div>
                <div class="flex items-center space-x-8">
                    <a href="index.html" class="text-gray-600 hover:text-blue-800 transition-colors">安全监控</a>
                    <a href="risk-assessment.html" class="text-gray-600 hover:text-blue-800 transition-colors">风险评估</a>
                    <a href="incident-report.html" class="text-gray-600 hover:text-blue-800 transition-colors">事故报告</a>
                    <a href="training-management.html" class="text-blue-800 font-medium border-b-2 border-blue-800 pb-1">培训管理</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <div class="pt-16">
        <!-- 标题区域 -->
        <div class="bg-gradient-to-r from-green-600 to-blue-600 text-white py-12">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="text-center">
                    <h1 class="hero-title text-4xl font-bold mb-4">安全培训管理系统</h1>
                    <p class="text-xl text-green-100">规范培训管理，提升员工安全意识和操作技能</p>
                </div>
            </div>
        </div>

        <!-- 主要内容区域 -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- 统计概览 -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow-md p-6 card-hover">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-600">培训计划</p>
                            <p class="text-3xl font-bold text-blue-600" id="total-plans">12</p>
                        </div>
                        <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                    </div>
                    <p class="text-xs text-gray-500 mt-2">本月新增 <span class="text-blue-500">+3</span></p>
                </div>

                <div class="bg-white rounded-lg shadow-md p-6 card-hover">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-600">参训人员</p>
                            <p class="text-3xl font-bold text-green-600" id="total-trainees">156</p>
                        </div>
                        <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                            <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"></path>
                            </svg>
                        </div>
                    </div>
                    <p class="text-xs text-gray-500 mt-2">覆盖率 <span class="text-green-500">98%</span></p>
                </div>

                <div class="bg-white rounded-lg shadow-md p-6 card-hover">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-600">证书到期</p>
                            <p class="text-3xl font-bold text-orange-600" id="expiring-certificates">8</p>
                        </div>
                        <div class="w-12 h-12 bg-orange-100 rounded-full flex items-center justify-center">
                            <svg class="w-6 h-6 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                    </div>
                    <p class="text-xs text-gray-500 mt-2">需及时更新</p>
                </div>

                <div class="bg-white rounded-lg shadow-md p-6 card-hover">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-600">培训通过率</p>
                            <p class="text-3xl font-bold text-purple-600" id="pass-rate">94.5%</p>
                        </div>
                        <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center">
                            <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                            </svg>
                        </div>
                    </div>
                    <p class="text-xs text-gray-500 mt-2">较上月 <span class="text-green-500">+2.1%</span></p>
                </div>
            </div>

            <!-- 主要内容网格 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- 左侧：培训计划和日历 -->
                <div class="space-y-8">
                    <!-- 培训计划表单 -->
                    <div class="bg-white rounded-lg shadow-md p-6">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">培训计划制定</h3>
                        <form id="training-form" class="space-y-4">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">培训主题</label>
                                    <input type="text" class="form-input w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" id="training-topic" placeholder="请输入培训主题" required>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">培训类型</label>
                                    <select class="form-input w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" id="training-type" required>
                                        <option value="">请选择类型</option>
                                        <option value="安全法规">安全法规</option>
                                        <option value="操作技能">操作技能</option>
                                        <option value="应急处理">应急处理</option>
                                        <option value="设备维护">设备维护</option>
                                        <option value="管理知识">管理知识</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">培训日期</label>
                                    <input type="date" class="form-input w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" id="training-date" required>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">培训时长</label>
                                    <select class="form-input w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" id="training-duration" required>
                                        <option value="">请选择时长</option>
                                        <option value="1">1小时</option>
                                        <option value="2">2小时</option>
                                        <option value="3">3小时</option>
                                        <option value="4">4小时</option>
                                        <option value="8">全天</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">培训讲师</label>
                                <input type="text" class="form-input w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" id="training-instructor" placeholder="请输入讲师姓名" required>
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">培训地点</label>
                                <input type="text" class="form-input w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" id="training-location" placeholder="请输入培训地点" required>
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">参与部门</label>
                                <select class="form-input w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" id="training-department" required>
                                    <option value="">请选择部门</option>
                                    <option value="运营部">运营部</option>
                                    <option value="维护部">维护部</option>
                                    <option value="安全部">安全部</option>
                                    <option value="管理部">管理部</option>
                                    <option value="全部">全部</option>
                                </select>
                            </div>
                            
                            <button type="submit" class="w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 transition-colors font-medium">
                                创建培训计划
                            </button>
                        </form>
                    </div>

                    <!-- 培训日历 -->
                    <div class="bg-white rounded-lg shadow-md p-6">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">培训日历</h3>
                        <div class="mb-4 flex justify-between items-center">
                            <button id="prev-month" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                                </svg>
                            </button>
                            <h4 id="calendar-title" class="text-lg font-semibold text-gray-800"></h4>
                            <button id="next-month" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                </svg>
                            </button>
                        </div>
                        <div id="calendar-grid" class="grid grid-cols-7 gap-1">
                            <!-- 日历将通过JavaScript动态生成 -->
                        </div>
                    </div>
                </div>

                <!-- 右侧：培训记录和统计 -->
                <div class="space-y-8">
                    <!-- 培训记录查询 -->
                    <div class="bg-white rounded-lg shadow-md p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-semibold text-gray-800">培训记录</h3>
                            <div class="flex space-x-2">
                                <select class="px-3 py-1 border border-gray-300 rounded text-sm" id="record-filter">
                                    <option value="">全部类型</option>
                                    <option value="安全法规">安全法规</option>
                                    <option value="操作技能">操作技能</option>
                                    <option value="应急处理">应急处理</option>
                                    <option value="设备维护">设备维护</option>
                                </select>
                                <input type="text" placeholder="搜索..." class="px-3 py-1 border border-gray-300 rounded text-sm" id="record-search">
                            </div>
                        </div>
                        
                        <div class="space-y-3" id="training-records">
                            <!-- 培训记录将通过JavaScript动态生成 -->
                        </div>
                    </div>

                    <!-- 证书管理 -->
                    <div class="bg-white rounded-lg shadow-md p-6">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">证书状态管理</h3>
                        <div class="space-y-3" id="certificate-list">
                            <!-- 证书列表将通过JavaScript动态生成 -->
                        </div>
                    </div>

                    <!-- 培训效果分析 -->
                    <div class="bg-white rounded-lg shadow-md p-6">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">培训效果分析</h3>
                        <div id="training-effect-chart" class="h-64"></div>
                    </div>
                </div>
            </div>

            <!-- 培训统计图表 -->
            <div class="mt-8 grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">培训类型分布</h3>
                    <div id="training-type-chart" class="h-64"></div>
                </div>

                <div class="bg-white rounded-lg shadow-md p-6">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">培训参与趋势</h3>
                    <div id="training-trend-chart" class="h-64"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-gray-800 text-white py-8 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p class="text-sm text-gray-400">&copy; 2025 梁邹铁路专用线运营安全监控系统. 保留所有权利.</p>
        </div>
    </footer>

    <script>
        // 培训管理页面专用JavaScript
        const trainingData = {
            trainings: [
                {
                    id: 1,
                    topic: '铁路安全法规培训',
                    type: '安全法规',
                    date: '2025-12-15',
                    duration: 4,
                    instructor: '李教授',
                    location: '培训室A',
                    department: '全部',
                    participants: 45,
                    passRate: 95.6,
                    status: 'completed'
                },
                {
                    id: 2,
                    topic: '信号设备操作培训',
                    type: '操作技能',
                    date: '2025-12-20',
                    duration: 3,
                    instructor: '王工程师',
                    location: '实训室B',
                    department: '维护部',
                    participants: 25,
                    passRate: 0,
                    status: 'scheduled'
                },
                {
                    id: 3,
                    topic: '应急处理演练',
                    type: '应急处理',
                    date: '2025-12-25',
                    duration: 8,
                    instructor: '张主任',
                    location: '演练场',
                    department: '运营部',
                    participants: 30,
                    passRate: 0,
                    status: 'scheduled'
                }
            ],
            certificates: [
                {
                    id: 1,
                    employee: '张三',
                    certificate: '铁路安全操作证',
                    issueDate: '2023-01-15',
                    expiryDate: '2026-01-15',
                    status: 'valid',
                    daysLeft: 30
                },
                {
                    id: 2,
                    employee: '李四',
                    certificate: '信号设备维护证',
                    issueDate: '2023-02-20',
                    expiryDate: '2026-02-20',
                    status: 'expiring',
                    daysLeft: 65
                },
                {
                    id: 3,
                    employee: '王五',
                    certificate: '应急处置资格证',
                    issueDate: '2023-03-10',
                    expiryDate: '2026-03-10',
                    status: 'expired',
                    daysLeft: -10
                }
            ],
            currentDate: new Date(),
            effectData: [
                { month: '2025-01', before: 75, after: 85 },
                { month: '2025-02', before: 78, after: 88 },
                { month: '2025-03', before: 72, after: 82 },
                { month: '2025-04', before: 80, after: 90 },
                { month: '2025-05', before: 76, after: 86 },
                { month: '2025-06', before: 79, after: 89 },
                { month: '2025-07', before: 81, after: 91 },
                { month: '2025-08', before: 77, after: 87 },
                { month: '2025-09', before: 83, after: 93 },
                { month: '2025-10', before: 85, after: 95 },
                { month: '2025-11', before: 82, after: 92 },
                { month: '2025-12', before: 84, after: 94 }
            ]
        };

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initTrainingTypeChart();
            initTrainingTrendChart();
            initTrainingEffectChart();
            renderTrainingRecords();
            renderCertificateList();
            initCalendar();
            bindEvents();
        });

        // 初始化培训类型分布图表
        function initTrainingTypeChart() {
            const typeChart = echarts.init(document.getElementById('training-type-chart'));
            
            const option = {
                tooltip: {
                    trigger: 'item',
                    formatter: '{a} <br/>{b}: {c} ({d}%)'
                },
                legend: {
                    orient: 'vertical',
                    left: 'left',
                    textStyle: { color: '#64748b' }
                },
                series: [
                    {
                        name: '培训类型',
                        type: 'pie',
                        radius: ['40%', '70%'],
                        center: ['60%', '50%'],
                        avoidLabelOverlap: false,
                        itemStyle: {
                            borderRadius: 10,
                            borderColor: '#fff',
                            borderWidth: 2
                        },
                        label: { show: false },
                        emphasis: {
                            label: {
                                show: true,
                                fontSize: 16,
                                fontWeight: 'bold'
                            }
                        },
                        data: [
                            { value: 35, name: '安全法规', itemStyle: { color: '#3b82f6' } },
                            { value: 25, name: '操作技能', itemStyle: { color: '#10b981' } },
                            { value: 20, name: '应急处理', itemStyle: { color: '#f59e0b' } },
                            { value: 15, name: '设备维护', itemStyle: { color: '#ef4444' } },
                            { value: 5, name: '管理知识', itemStyle: { color: '#8b5cf6' } }
                        ]
                    }
                ]
            };
            
            typeChart.setOption(option);
            
            window.addEventListener('resize', () => {
                typeChart.resize();
            });
        }

        // 初始化培训趋势图表
        function initTrainingTrendChart() {
            const trendChart = echarts.init(document.getElementById('training-trend-chart'));
            
            const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
            const participants = [120, 135, 128, 142, 156, 148, 165, 158, 172, 168, 175, 156];
            
            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'cross' }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: months,
                    axisLabel: { color: '#64748b' }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: { color: '#64748b' }
                },
                series: [
                    {
                        name: '参训人数',
                        type: 'line',
                        data: participants,
                        smooth: true,
                        lineStyle: { color: '#10b981', width: 3 },
                        itemStyle: { color: '#10b981' },
                        areaStyle: {
                            color: {
                                type: 'linear',
                                x: 0, y: 0, x2: 0, y2: 1,
                                colorStops: [
                                    { offset: 0, color: 'rgba(16, 185, 129, 0.3)' },
                                    { offset: 1, color: 'rgba(16, 185, 129, 0.05)' }
                                ]
                            }
                        }
                    }
                ]
            };
            
            trendChart.setOption(option);
            
            window.addEventListener('resize', () => {
                trendChart.resize();
            });
        }

        // 初始化培训效果分析图表
        function initTrainingEffectChart() {
            const effectChart = echarts.init(document.getElementById('training-effect-chart'));
            
            const months = trainingData.effectData.map(item => item.month);
            const beforeTraining = trainingData.effectData.map(item => item.before);
            const afterTraining = trainingData.effectData.map(item => item.after);
            
            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'cross' }
                },
                legend: {
                    data: ['培训前', '培训后'],
                    top: 10
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: months,
                    axisLabel: { color: '#64748b' }
                },
                yAxis: {
                    type: 'value',
                    name: '掌握程度(%)',
                    axisLabel: { color: '#64748b' }
                },
                series: [
                    {
                        name: '培训前',
                        type: 'line',
                        data: beforeTraining,
                        smooth: true,
                        lineStyle: { color: '#ef4444', width: 3 },
                        itemStyle: { color: '#ef4444' }
                    },
                    {
                        name: '培训后',
                        type: 'line',
                        data: afterTraining,
                        smooth: true,
                        lineStyle: { color: '#10b981', width: 3 },
                        itemStyle: { color: '#10b981' }
                    }
                ]
            };
            
            effectChart.setOption(option);
            
            window.addEventListener('resize', () => {
                effectChart.resize();
            });
        }

        // 渲染培训记录
        function renderTrainingRecords() {
            const recordsContainer = document.getElementById('training-records');
            const filter = document.getElementById('record-filter').value;
            const search = document.getElementById('record-search').value.toLowerCase();
            
            let filteredTrainings = trainingData.trainings;
            
            // 应用筛选
            if (filter) {
                filteredTrainings = filteredTrainings.filter(training => training.type === filter);
            }
            
            if (search) {
                filteredTrainings = filteredTrainings.filter(training => 
                    training.topic.toLowerCase().includes(search) ||
                    training.instructor.toLowerCase().includes(search)
                );
            }
            
            recordsContainer.innerHTML = filteredTrainings.map(training => `
                <div class="border border-gray-200 rounded-lg p-4 hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center space-x-2">
                            <span class="px-2 py-1 text-xs rounded-full ${getTrainingTypeColor(training.type)}">${training.type}</span>
                            <span class="text-sm font-medium text-gray-800">${training.topic}</span>
                        </div>
                        <span class="px-2 py-1 text-xs rounded-full ${getTrainingStatusColor(training.status)}">${getTrainingStatusText(training.status)}</span>
                    </div>
                    <div class="text-xs text-gray-500 mb-2">
                        <span>讲师: ${training.instructor}</span> | 
                        <span>日期: ${training.date}</span> | 
                        <span>时长: ${training.duration}小时</span>
                    </div>
                    <div class="text-xs text-gray-500 mb-2">
                        <span>地点: ${training.location}</span> | 
                        <span>参与: ${training.participants}人</span>
                        ${training.passRate > 0 ? `| <span>通过率: ${training.passRate}%</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // 渲染证书列表
        function renderCertificateList() {
            const certificateContainer = document.getElementById('certificate-list');
            
            certificateContainer.innerHTML = trainingData.certificates.map(cert => `
                <div class="border border-gray-200 rounded-lg p-4 hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h4 class="text-sm font-medium text-gray-800">${cert.employee}</h4>
                            <p class="text-xs text-gray-600">${cert.certificate}</p>
                        </div>
                        <span class="px-2 py-1 text-xs rounded-full ${getCertificateStatusColor(cert.status)}">${getCertificateStatusText(cert.status)}</span>
                    </div>
                    <div class="text-xs text-gray-500">
                        <p>发证日期: ${cert.issueDate}</p>
                        <p>到期日期: ${cert.expiryDate}</p>
                        ${cert.daysLeft > 0 ? `<p class="text-orange-600">剩余 ${cert.daysLeft} 天</p>` : 
                          cert.daysLeft < 0 ? `<p class="text-red-600">已过期 ${Math.abs(cert.daysLeft)} 天</p>` : 
                          `<p class="text-red-600">今日到期</p>`}
                    </div>
                    <div class="mt-2">
                        <button class="px-3 py-1 bg-blue-500 text-white text-xs rounded hover:bg-blue-600 transition-colors" onclick="renewCertificate(${cert.id})">
                            续期提醒
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 初始化日历
        function initCalendar() {
            updateCalendar();
        }

        // 更新日历
        function updateCalendar() {
            const year = trainingData.currentDate.getFullYear();
            const month = trainingData.currentDate.getMonth();
            
            document.getElementById('calendar-title').textContent = `${year}年${month + 1}月`;
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDate = new Date(firstDay);
            startDate.setDate(startDate.getDate() - firstDay.getDay());
            
            const calendarGrid = document.getElementById('calendar-grid');
            calendarGrid.innerHTML = '';
            
            // 添加星期标题
            const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
            weekDays.forEach(day => {
                const dayElement = document.createElement('div');
                dayElement.className = 'text-center text-xs font-medium text-gray-500 p-2';
                dayElement.textContent = day;
                calendarGrid.appendChild(dayElement);
            });
            
            // 添加日期
            for (let i = 0; i < 42; i++) {
                const currentDate = new Date(startDate);
                currentDate.setDate(startDate.getDate() + i);
                
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day text-center text-sm p-2 rounded';
                dayElement.textContent = currentDate.getDate();
                
                if (currentDate.getMonth() !== month) {
                    dayElement.className += ' text-gray-300';
                } else {
                    dayElement.className += ' text-gray-800';
                    
                    // 检查是否有培训安排
                    const hasTraining = trainingData.trainings.some(training => 
                        training.date === currentDate.toISOString().split('T')[0]
                    );
                    
                    if (hasTraining) {
                        dayElement.className += ' has-training';
                        dayElement.title = '有培训安排';
                    }
                    
                    // 高亮今天
                    if (currentDate.toDateString() === new Date().toDateString()) {
                        dayElement.className += ' ring-2 ring-blue-500';
                    }
                }
                
                calendarGrid.appendChild(dayElement);
            }
        }

        // 获取培训类型颜色
        function getTrainingTypeColor(type) {
            switch (type) {
                case '安全法规': return 'bg-blue-100 text-blue-800';
                case '操作技能': return 'bg-green-100 text-green-800';
                case '应急处理': return 'bg-orange-100 text-orange-800';
                case '设备维护': return 'bg-red-100 text-red-800';
                case '管理知识': return 'bg-purple-100 text-purple-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        // 获取培训状态颜色
        function getTrainingStatusColor(status) {
            switch (status) {
                case 'scheduled': return 'bg-yellow-100 text-yellow-800';
                case 'completed': return 'bg-green-100 text-green-800';
                case 'cancelled': return 'bg-red-100 text-red-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        // 获取培训状态文本
        function getTrainingStatusText(status) {
            switch (status) {
                case 'scheduled': return '已安排';
                case 'completed': return '已完成';
                case 'cancelled': return '已取消';
                default: return '未知';
            }
        }

        // 获取证书状态颜色
        function getCertificateStatusColor(status) {
            switch (status) {
                case 'valid': return 'bg-green-100 text-green-800';
                case 'expiring': return 'bg-orange-100 text-orange-800';
                case 'expired': return 'bg-red-100 text-red-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        // 获取证书状态文本
        function getCertificateStatusText(status) {
            switch (status) {
                case 'valid': return '有效';
                case 'expiring': return '即将到期';
                case 'expired': return '已过期';
                default: return '未知';
            }
        }

        // 续期证书
        function renewCertificate(certId) {
            const cert = trainingData.certificates.find(c => c.id === certId);
            if (cert) {
                alert(`已发送续期提醒给${cert.employee}，证书：${cert.certificate}`);
            }
        }

        // 绑定事件
        function bindEvents() {
            // 表单提交
            document.getElementById('training-form').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const formData = {
                    topic: document.getElementById('training-topic').value,
                    type: document.getElementById('training-type').value,
                    date: document.getElementById('training-date').value,
                    duration: document.getElementById('training-duration').value,
                    instructor: document.getElementById('training-instructor').value,
                    location: document.getElementById('training-location').value,
                    department: document.getElementById('training-department').value
                };
                
                if (!formData.topic || !formData.type || !formData.date || !formData.duration || !formData.instructor || !formData.location || !formData.department) {
                    alert('请填写完整的培训信息');
                    return;
                }
                
                // 添加新培训
                const newTraining = {
                    id: trainingData.trainings.length + 1,
                    topic: formData.topic,
                    type: formData.type,
                    date: formData.date,
                    duration: parseInt(formData.duration),
                    instructor: formData.instructor,
                    location: formData.location,
                    department: formData.department,
                    participants: 0,
                    passRate: 0,
                    status: 'scheduled'
                };
                
                trainingData.trainings.unshift(newTraining);
                renderTrainingRecords();
                updateCalendar();
                
                // 重置表单
                document.getElementById('training-form').reset();
                
                // 显示成功消息
                alert('培训计划已创建成功！');
            });
            
            // 筛选和搜索
            document.getElementById('record-filter').addEventListener('change', renderTrainingRecords);
            document.getElementById('record-search').addEventListener('input', renderTrainingRecords);
            
            // 日历导航
            document.getElementById('prev-month').addEventListener('click', function() {
                trainingData.currentDate.setMonth(trainingData.currentDate.getMonth() - 1);
                updateCalendar();
            });
            
            document.getElementById('next-month').addEventListener('click', function() {
                trainingData.currentDate.setMonth(trainingData.currentDate.getMonth() + 1);
                updateCalendar();
            });
        }

        // 页面加载动画
        window.addEventListener('load', function() {
            anime({
                targets: '.card-hover',
                translateY: [50, 0],
                opacity: [0, 1],
                delay: anime.stagger(100),
                duration: 800,
                easing: 'easeOutQuad'
            });
        });
    </script>
</body>
</html>
