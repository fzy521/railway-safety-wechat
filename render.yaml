# Render部署配置文件
services:
  - type: web
    name: railway-safety-system
    env: node
    buildCommand: npm install
    startCommand: npm start
    nodeVersion: "20"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        value: ./database/railway_safety.db
      - key: NODE_OPTIONS
        value: "--max-old-space-size=4096"
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/database
      sizeGB: 1