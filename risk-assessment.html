                    <div class="flex items-center">

                        <div class="ml-3">
                            <p class="font-medium text-gray-800">风险评估</p>

                    </div>
                    <div class="flex-1 h-1 bg-gray-200 mx-4"></div>
                    
                    <div class="flex items-center">
                        <div class="w-10 h-10 bg-orange-500 text-white rounded-full flex items-center justify-center font-bold">3</div>
                        <div class="ml-3">
                            <p class="font-medium text-gray-800">制定措施</p>
                            <p class="text-sm text-gray-600">设计控制方案</p>

                    </div>
                    <div class="flex-1 h-1 bg-gray-200 mx-4"></div>
                    
                    <div class="flex items-center">
                        <div class="w-10 h-10 bg-green-500 text-white rounded-full flex items-center justify-center font-bold">4</div>
                        <div class="ml-3">
                            <p class="font-medium text-gray-800">实施监控</p>

    <script>
        // 风险评估页面专用JavaScript
        const riskData = {
            risks: [
                {
                    id: 1,
                    location: 'A站',
                    type: '设备故障',
                    description: '信号设备老化，存在故障风险',
                    probability: 3,
                    exposure: 4,
                    severity: 4,
                    riskScore: 48,
                    level: '高风险',
                    levelClass: 'high',
                    status: 'pending',
                    reporter: '张三',
                    date: '2025-12-10',

                    mes: 'M3-E4-S4'
                },
                {
                    id: 2,
                    location: '轨道区间1',
                    type: '环境因素',
                    description: '近期降雨频繁，轨道湿滑',
                    probability: 4,
                    exposure: 5,
                    severity: 3,
                    riskScore: 60,
                    level: '高风险',
                    levelClass: 'high',
                    status: 'processing',
                    reporter: '李四',
                    date: '2025-12-08',
                    measures: '加强巡检，及时清理',
                    mes: 'M4-E5-S3'
                },
                {
                    id: 3,
                    location: 'B站',
                    type: '人为因素',
                    description: '新员工操作不熟练',
                    probability: 2,
                    exposure: 3,
                    severity: 3,
                    riskScore: 18,
                    level: '中等风险',
                    levelClass: 'medium',
                    status: 'resolved',
                    reporter: '王五',
                    date: '2025-12-05',
                    measures: '加强培训，安排师傅指导',
                    mes: 'M2-E3-S3'
                },
                {
                    id: 4,
                    location: 'C站',
                    type: '管理缺陷',
                    description: '应急预案不完善',
                    probability: 2,
                    exposure: 2,
                    severity: 5,
                    riskScore: 20,
                    level: '中等风险',
                    levelClass: 'medium',
                    status: 'pending',
                    reporter: '赵六',
                    date: '2025-12-12',
                    measures: '待制定',
                    mes: 'M2-E2-S5'
                }
            ],
            trendData: [
                { month: '2025-01', high: 2, medium: 5, low: 8 },
                { month: '2025-02', high: 1, medium: 4, low: 7 },
                { month: '2025-03', high: 3, medium: 6, low: 9 },
                { month: '2025-04', high: 2, medium: 5, low: 8 },
                { month: '2025-05', high: 4, medium: 7, low: 10 },
                { month: '2025-06', high: 3, medium: 6, low: 9 },
                { month: '2025-07', high: 2, medium: 5, low: 8 },
                { month: '2025-08', high: 1, medium: 4, low: 7 },
                { month: '2025-09', high: 2, medium: 5, low: 8 },
                { month: '2025-10', high: 3, medium: 6, low: 9 },
                { month: '2025-11', high: 4, medium: 7, low: 10 },
                { month: '2025-12', high: 5, medium: 8, low: 11 }
            ]
        };

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initRiskMatrix();
            initRiskTrend();
            initRiskDistribution();
            renderRiskList();
            bindEvents();
        });

        // 初始化风险矩阵
        function initRiskMatrix() {
            const matrixChart = echarts.init(document.getElementById('risk-matrix'));
            
            const data = [];
            for (let i = 1; i <= 5; i++) {
                for (let j = 1; j <= 5; j++) {
                    let level = '';
                    let color = '';
                    if (i * j <= 6) {
                        level = '低风险';
                        color = '#10b981';
                    } else if (i * j <= 12) {
                        level = '中等风险';
                        color = '#f59e0b';
                    } else {
                        level = '高风险';
                        color = '#ef4444';
                    }
                    data.push([j, i, level, color, i * j]);
                }
            }

            const option = {
                tooltip: {
                    position: 'top',
                    formatter: function(params) {
                        return `可能性: ${params.data[0]}<br/>严重性: ${params.data[1]}<br/>等级: ${params.data[2]}`;
                    }
                },
                grid: {
                    height: '70%',
                    top: '10%'
                },
                xAxis: {
                    type: 'category',
                    data: ['极低', '低', '中等', '高', '极高'],
                    splitArea: {
                        show: true
                    },
                    axisLabel: {
                        color: '#64748b'
                    }
                },
                yAxis: {
                    type: 'category',
                    data: ['轻微', '一般', '较重', '严重', '特别严重'],
                    splitArea: {
                        show: true
                    },
                    axisLabel: {
                        color: '#64748b'
                    }
                },
                visualMap: {
                    min: 1,
                    max: 25,
                    calculable: true,
                    orient: 'horizontal',
                    left: 'center',
                    bottom: '5%',
                    inRange: {
                        color: ['#10b981', '#f59e0b', '#ef4444']
                    }
                },
                series: [{
                    name: '风险矩阵',
                    type: 'heatmap',
                    data: data.map(item => [item[0]-1, item[1]-1, item[4]]),
                    label: {
                        show: true,
                        formatter: function(params) {
                            return data[params.dataIndex][2];
                        }
                    },
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    }
                }]
            };

            matrixChart.setOption(option);
            
            window.addEventListener('resize', () => {
                matrixChart.resize();
            });
        }

        // 初始化风险趋势图
        function initRiskTrend() {
            const trendChart = echarts.init(document.getElementById('risk-trend'));
            
            const months = riskData.trendData.map(item => item.month);
            const highRisks = riskData.trendData.map(item => item.high);
            const mediumRisks = riskData.trendData.map(item => item.medium);
            const lowRisks = riskData.trendData.map(item => item.low);
            
            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross'
                    }
                },
                legend: {
                    data: ['高风险', '中等风险', '低风险'],
                    top: 10
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: months,
                    axisLabel: {
                        color: '#64748b'
                    }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: {
                        color: '#64748b'
                    }
                },
                series: [
                    {
                        name: '高风险',
                        type: 'line',
                        data: highRisks,
                        smooth: true,
                        lineStyle: { color: '#ef4444', width: 3 },
                        itemStyle: { color: '#ef4444' },
                        areaStyle: {
                            color: {
                                type: 'linear',
                                x: 0, y: 0, x2: 0, y2: 1,
                                colorStops: [
                                    { offset: 0, color: 'rgba(239, 68, 68, 0.3)' },
                                    { offset: 1, color: 'rgba(239, 68, 68, 0.05)' }
                                ]
                            }
                        }
                    },
                    {
                        name: '中等风险',
                        type: 'line',
                        data: mediumRisks,
                        smooth: true,
                        lineStyle: { color: '#f59e0b', width: 3 },
                        itemStyle: { color: '#f59e0b' },
                        areaStyle: {
                            color: {
                                type: 'linear',
                                x: 0, y: 0, x2: 0, y2: 1,
                                colorStops: [
                                    { offset: 0, color: 'rgba(245, 158, 11, 0.3)' },
                                    { offset: 1, color: 'rgba(245, 158, 11, 0.05)' }
                                ]
                            }
                        }
                    },
                    {
                        name: '低风险',
                        type: 'line',
                        data: lowRisks,
                        smooth: true,
                        lineStyle: { color: '#10b981', width: 3 },
                        itemStyle: { color: '#10b981' },
                        areaStyle: {
                            color: {
                                type: 'linear',
                                x: 0, y: 0, x2: 0, y2: 1,
                                colorStops: [
                                    { offset: 0, color: 'rgba(16, 185, 129, 0.3)' },
                                    { offset: 1, color: 'rgba(16, 185, 129, 0.05)' }
                                ]
                            }
                        }
                    }
                ]
            };
            
            trendChart.setOption(option);
            
            window.addEventListener('resize', () => {
                trendChart.resize();
            });
        }

        // 初始化风险分布统计
        function initRiskDistribution() {
            const distributionChart = echarts.init(document.getElementById('risk-distribution'));
            
            const option = {
                tooltip: {
                    trigger: 'item',
                    formatter: '{a} <br/>{b}: {c} ({d}%)'
                },
                legend: {
                    orient: 'vertical',
                    left: 'left',
                    textStyle: { color: '#64748b' }
                },
                series: [
                    {
                        name: '风险类型分布',
                        type: 'pie',
                        radius: ['40%', '70%'],
                        center: ['60%', '50%'],
                        avoidLabelOverlap: false,
                        itemStyle: {
                            borderRadius: 10,
                            borderColor: '#fff',
                            borderWidth: 2
                        },
                        label: { show: false },
                        emphasis: {
                            label: {
                                show: true,
                                fontSize: 16,
                                fontWeight: 'bold'
                            }
                        },
                        data: [
                            { value: 35, name: '设备故障', itemStyle: { color: '#ef4444' } },
                            { value: 25, name: '人为因素', itemStyle: { color: '#f97316' } },
                            { value: 20, name: '环境因素', itemStyle: { color: '#eab308' } },
                            { value: 15, name: '管理缺陷', itemStyle: { color: '#3b82f6' } },
                            { value: 5, name: '其他', itemStyle: { color: '#6b7280' } }
                        ]
                    }
                ]
            };
            
            distributionChart.setOption(option);
            
            window.addEventListener('resize', () => {
                distributionChart.resize();
            });
        }

        // 渲染风险列表
        function renderRiskList() {
            const riskList = document.getElementById('risk-list');
            const filter = document.getElementById('risk-filter').value;
            const search = document.getElementById('risk-search').value.toLowerCase();
            
            let filteredRisks = riskData.risks;
            
            // 应用筛选
            if (filter) {
                filteredRisks = filteredRisks.filter(risk => risk.status === filter);
            }
            
            if (search) {
                filteredRisks = filteredRisks.filter(risk => 
                    risk.location.toLowerCase().includes(search) ||
                    risk.type.toLowerCase().includes(search) ||
                    risk.description.toLowerCase().includes(search)
                );
            }
            
            riskList.innerHTML = filteredRisks.map(risk => `
                <div class="border border-gray-200 rounded-lg p-4 hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center space-x-2">
                            <span class="px-2 py-1 text-xs rounded-full ${getRiskLevelColor(risk.level)}">${risk.level}</span>
                            <span class="text-sm font-medium text-gray-800">${risk.location}</span>
                            <span class="px-2 py-1 text-xs rounded-full bg-gray-100 text-gray-800 font-mono">${risk.mes || `M${risk.probability}-E${risk.exposure || '?'}-S${risk.severity}`}</span>
                        </div>
                        <span class="px-2 py-1 text-xs rounded-full ${getStatusColor(risk.status)}">${getStatusText(risk.status)}</span>
                    </div>
                    <p class="text-sm text-gray-700 mb-2">${risk.description}</p>
                    <div class="flex justify-between items-center text-xs text-gray-500">
                        <span>类型: ${risk.type}</span>
                        <span>MES: M${risk.probability}/E${risk.exposure || '?'}/S${risk.severity}</span>
                        <span>发现人: ${risk.reporter}</span>
                        <span>日期: ${risk.date}</span>
                    </div>
                    ${risk.exposure ? `<div class="mt-2 text-xs text-blue-600">
                        <span>风险值: ${risk.riskScore} (M${risk.probability}×E${risk.exposure}×S${risk.severity})</span>
                    </div>` : ''}
                    <div class="mt-2 text-xs text-gray-600">
                        <span>措施: ${risk.measures}</span>
                    </div>
                </div>
            `).join('');
        }

        // 获取风险等级颜色
        function getRiskLevelColor(level) {
            if (level.includes('极高')) return 'bg-purple-100 text-purple-800';
            if (level.includes('高')) return 'bg-red-100 text-red-800';
            if (level.includes('中')) return 'bg-yellow-100 text-yellow-800';
            return 'bg-green-100 text-green-800';
        }

        // 获取状态颜色
        function getStatusColor(status) {
            switch (status) {
                case 'pending': return 'bg-orange-100 text-orange-800';
                case 'processing': return 'bg-blue-100 text-blue-800';
                case 'resolved': return 'bg-green-100 text-green-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        // 获取状态文本
        function getStatusText(status) {
            switch (status) {
                case 'pending': return '待处理';
                case 'processing': return '处理中';
                case 'resolved': return '已解决';
                default: return '未知';
            }
        }

        // 绑定事件
        function bindEvents() {
            // 表单提交
            document.getElementById('risk-form').addEventListener('submit', function(e) {
                e.preventDefault();

                // 获取表单数据
                const formData = {
                    location: document.getElementById('risk-location').value,
                    type: document.getElementById('risk-type').value,
                    probability: document.getElementById('risk-probability').value,
                    exposure: document.getElementById('risk-exposure').value,
                    severity: document.getElementById('risk-severity').value,
                    description: document.getElementById('risk-description').value,
                    reporter: document.getElementById('risk-reporter').value
                };

                // 验证必填字段
                if (!formData.location || !formData.type || !formData.probability || !formData.exposure || !formData.severity || !formData.description || !formData.reporter) {
                    showMessage('请填写所有必填字段', 'error');
                    return;
                }

                // 验证数值字段
                if (isNaN(formData.probability) || isNaN(formData.exposure) || isNaN(formData.severity)) {
                    showMessage('风险评估参数必须为数字', 'error');
                    return;
                }

                const probability = parseInt(formData.probability);
                const exposure = parseInt(formData.exposure);
                const severity = parseInt(formData.severity);

                if (probability < 1 || probability > 5 || exposure < 1 || exposure > 5 || severity < 1 || severity > 5) {
                    showMessage('风险评估参数必须在1-5之间', 'error');
                    return;
                }

                // 计算风险等级（MES方法：M × E × S）
                const riskScore = probability * exposure * severity;
                let level = '';
                let levelClass = '';

                // MES风险等级划分标准
                if (riskScore <= 8) {
                    level = '低风险';
                    levelClass = 'low';
                } else if (riskScore <= 36) {
                    level = '中等风险';
                    levelClass = 'medium';
                } else if (riskScore <= 64) {
                    level = '高风险';
                    levelClass = 'high';
                } else {
                    level = '极高风险';
                    levelClass = 'extreme';
                }

                // 添加新风险
                const newRisk = {
                    id: riskData.risks.length + 1,
                    location: formData.location,
                    type: formData.type,
                    description: formData.description,
                    probability: probability,
                    exposure: exposure,
                    severity: severity,
                    riskScore: riskScore,
                    level: level,
                    levelClass: levelClass,
                    status: 'pending',
                    reporter: formData.reporter,
                    date: new Date().toISOString().split('T')[0],
                    measures: '待制定',
                    mes: `M${formData.probability}-E${formData.exposure}-S${formData.severity}`
                };

                riskData.risks.unshift(newRisk);
                renderRiskList();

                // 重置表单
                document.getElementById('risk-form').reset();

                // 显示成功消息
                showMessage(`风险信息已提交！MES评分: ${newRisk.mes}, 等级: ${level}`, 'success');
            });
            
            // 筛选和搜索
            document.getElementById('risk-filter').addEventListener('change', renderRiskList);
            document.getElementById('risk-search').addEventListener('input', renderRiskList);
        }

        // 页面加载动画
        window.addEventListener('load', function() {
            anime({
                targets: '.card-hover',
                translateY: [50, 0],
                opacity: [0, 1],
                delay: anime.stagger(100),
                duration: 800,
                easing: 'easeOutQuad'
            });
        });
    </script>
</body>
</html>
